<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mailhouse social image source</title>
<link rel="stylesheet" href="styles.css">
<style>
 html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f4f6f9}
 .og{display:grid;grid-template-columns:600px 1fr;gap:40px;align-items:center;height:630px;padding:0 64px}
 .og h1{font-size:62px;font-stretch:112%;font-weight:800;line-height:1;letter-spacing:-.025em;margin:28px 0 22px}
 .og-copy p{font-size:23px;line-height:1.5;color:#5a6680;margin:0}
 .og .brand{font-size:26px}.og .brand svg{width:42px;height:42px}
 .og .envelope{transform:rotate(-3deg)}
</style></head><body>
<!-- Render at 1200x630 to assets/og.png -->
<div class="og"><div class="og-copy">
<span class="brand"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="6" fill="#17213d"/><path d="M6 14.5 16 7l10 7.5V25H6Z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="m6 14.5 10 6.5 10-6.5" stroke="#ef5a4f" stroke-width="2.2" stroke-linejoin="round"/></svg>Mailhouse</span>
<h1>One WordPress plugin for the whole path an email takes.</h1>
<p>SMTP and mail API delivery, a log of every message, and a self-hosted newsletter.</p>
</div><div>
        <div class="envelope" role="img" aria-label="An envelope postmarked Accepted, via one of Mailhouse’s fifteen transports">
          <p class="env-from">From your own domain,<br>with your logo and colours</p>
          <div class="env-stamp perf" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M6 14.5 16 7l10 7.5V25H6Z" stroke="#17213d" stroke-width="2" stroke-linejoin="round"/>
              <path d="m6 14.5 10 6.5 10-6.5" stroke="#c8231b" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
          <svg class="env-postmark" viewBox="0 0 200 110" aria-hidden="true">
            <defs>
              <path id="pm-top" d="M112 55a38 38 0 0 1 76 0"/>
              <path id="pm-bot" d="M104 55a46 46 0 0 0 92 0"/>
            </defs>
            <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M2 30c9-7 17 7 26 0s17 7 26 0 17 7 26 0 17 7 26 0"/>
              <path d="M2 46c9-7 17 7 26 0s17 7 26 0 17 7 26 0 17 7 26 0"/>
              <path d="M2 62c9-7 17 7 26 0s17 7 26 0 17 7 26 0 17 7 26 0"/>
              <path d="M2 78c9-7 17 7 26 0s17 7 26 0 17 7 26 0 17 7 26 0"/>
              <circle cx="150" cy="55" r="51"/>
              <circle cx="150" cy="55" r="31" stroke-width="1.6"/>
            </g>
            <g fill="currentColor" font-family="Archivo, sans-serif" font-weight="700" font-size="9.5" letter-spacing="1.6">
              <text><textPath href="#pm-top" startOffset="50%" text-anchor="middle">MAILHOUSE</textPath></text>
              <text><textPath href="#pm-bot" startOffset="50%" text-anchor="middle">ACCEPTED</textPath></text>
            </g>
            <g fill="currentColor" text-anchor="middle">
              <text x="150" y="47" font-family="Archivo, sans-serif" font-size="8" letter-spacing="1">VIA</text>
              <text class="pm-transport" x="150" y="60" font-size="13">SendGrid</text>
              <text class="pm-date" x="150" y="71" font-family="Archivo, sans-serif" font-size="7.5" letter-spacing=".6">18 NOV 2026</text>
            </g>
          </svg>
          <p class="env-to">
            <span class="env-label">To</span>
            <span>Everyone on your list,</span>
            <span>and the customer waiting on a password reset</span>
          </p>
        </div>
        </div></div>
</body></html>
