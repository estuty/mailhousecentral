# Keeps the gh-pages branch (what GitHub Pages serves) identical to main.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Push main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
